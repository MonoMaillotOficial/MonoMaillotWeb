<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mono Maillot - Inicio</title>
    <link rel="icon" href="imgs/Logo.png" type="image/png">
    <link rel="stylesheet" href="estilos/style.css">
    <script src="global-player.js" defer></script>
</head>
<body>
    <!-- Imágenes en las esquinas -->
    <img src="imgs/Abelcok.png" class="corner-img top-left" alt="Abel" title="Abel - El ***">
    <img src="imgs/Farlopa.png" class="corner-img top-right" alt="Oscar" title="Oscar - El calvo">
    <img src="imgs/Raulitas.png" class="corner-img bottom-left" alt="Raul" title="Raul - El llamadas infinitas">
    <img src="imgs/young.png" class="corner-img bottom-right" alt="Manu" title="Manu - El gafotas ciego">

    <div class="container home-container">
        <header>
             <img src="imgs/Logo.png" class="image main-logo brand-logo" alt="Mono Maillot" title="Monomaillor">    
             <h1 class="main-title wave-title" aria-label="Mono Maillot">
                <span>M</span><span>o</span><span>n</span><span>o</span>
                <span class="title-space"> </span>
                <span>M</span><span>a</span><span>i</span><span>l</span><span>l</span><span>o</span><span>t</span>
             </h1>
        </header>

        <main class="disks-selection">
            <div class="disk-item">
                <a href="disco1.html" class="disk-link">
                    <div class="disk-image-container">
                        <img src="imgs/Bendito talento.png" alt="1er Disco" class="disk-image">
                        <div class="disk-overlay">
                            <span>Bendito talento</span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="disk-item">
                <a href="disco2.html" class="disk-link">
                    <div class="disk-image-container">
                        <img src="imgs/disco2.png" alt="2do Disco" class="disk-image">
                        <div class="disk-overlay">
                            <span>2do disco</span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="disk-item">
                <a href="disco3.html" class="disk-link">
                    <div class="disk-image-container">
                        <img src="imgs/Logo.png" alt="APS" class="disk-image">
                        <div class="disk-overlay">
                            <span>APS</span>
                        </div>
                    </div>
                </a>
            </div>
        </main>

        <footer>
            <p>© 2026 Mono Maillot. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
