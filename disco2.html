<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2do Disco - Mono Maillot</title>
    <link rel="icon" href="imgs/favico.png" type="image/png">
    <link rel="stylesheet" href="estilos/style.css">
    <script src="global-player.js" defer></script>
    <script src="script_disco2.js" defer></script>
</head>
<body>
    <!-- Imágenes en las esquinas -->
    <img src="imgs/Abelcok.png" class="corner-img top-left" alt="Abel" title="Abel - El ***">
    <img src="imgs/Farlopa.png" class="corner-img top-right" alt="Oscar" title="Oscar - El calvo">
    <img src="imgs/Raulitas.png" class="corner-img bottom-left" alt="Raul" title="Raul - El llamadas infinitas">
    <img src="imgs/young.png" class="corner-img bottom-right" alt="Manu" title="Manu - El gafotas ciego">

    <div class="container">
        <header>
            <a href="index.html" class="brand-logo-link" title="Ir al inicio">
                <img src="imgs/Logo.png" class="image brand-logo" alt="Mono Maillot" title="Monomaillor">
            </a>
        </header>
        <section class="album-hero" aria-label="Portada del disco">
            <img src="imgs/disco2.png" alt="Portada de 2do disco">
            <div>
                <span>Disco</span>
                <h1>2do disco</h1>
            </div>
        </section>
        <div id="tracklist" class="tracklist">
            <div class="tracklist-header">
                <div>
                    <h2>Lista de canciones</h2>
                    <p>Haz clic en una canción para ver la letra y reproducirla.</p>
                </div>
            </div>
        </div>

        <section id="player-container">
            <div class="player">
                <div class="cover">
                    <div class="mm"><img id="cover-img" src="" alt="Cover" class="cover-image"></div>
                </div> 
                <h2 id="song-title">Song Title</h2>
                <div class="controls">
                    <button id="prev" class="nav-btn">⏮</button>
                    <button class="play">▶</button>
                    <button id="next" class="nav-btn">⏭</button>
                </div>
                <div class="time-control">
                    <span class="current">0:00</span>
                    <input type="range" class="progress" value="0">
                    <span class="duration">0:00</span>
                </div>
                <div class="volume-control">
                    <button class="mute">🔊</button>
                    <input type="range" class="volume" min="0" max="1" step="0.01" value="1">
                </div>
                <a id="download" href="#" download>⬇ Descargar</a>
            </div>
            <div id="lyrics-container">
                <div id="lyrics-content">
                    <!-- Lyrics will be injected here -->
                    <p>Selecciona una canción para ver la letra.</p>
                </div>
            </div>
        </section>

        <audio id="audio">
            <source src="" type="audio/mpeg">
        </audio>

         
        <footer>
                <p>© 2026 Mono Maillot. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
